services:
  # ─── PostgreSQL з pgvector extension (для AI RAG семантичного пошуку) ───
  # Образ pgvector/pgvector:pg16 = офіційний PostgreSQL 16 + встановлений pgvector.
  # Init-скрипт ./docker/postgres/init-pgvector.sql виконує CREATE EXTENSION vector
  # при ПЕРШОМУ створенні БД (коли pgdata volume порожній).
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-teacher_licence}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-pgvector.sql:/docker-entrypoint-initdb.d/00-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Backend (Spring Boot) ───
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tl-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-teacher_licence}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-default-dev-secret-key-change-in-production-must-be-at-least-256-bits-long}
      AI_ENABLED: ${AI_ENABLED:-true}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_CLIENT_SERVER_URL: ${MISTRAL_CLIENT_SERVER_URL:-https://api.mistral.ai}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-mistral-medium-latest}
      # ─── AI RAG (семантичний пошук через pgvector) ───
      MISTRAL_EMBED_MODEL: ${MISTRAL_EMBED_MODEL:-mistral-embed}
      AI_RAG_ENABLED: ${AI_RAG_ENABLED:-true}
      PGVECTOR_INIT_SCHEMA: ${PGVECTOR_INIT_SCHEMA:-true}
      AI_RAG_REINDEX_MS: ${AI_RAG_REINDEX_MS:-300000}
      GOOGLE_DRIVE_ENABLED: ${GOOGLE_DRIVE_ENABLED:-false}
      GOOGLE_DRIVE_CREDENTIALS: /app/config/google-credentials.json
      GOOGLE_DRIVE_ROOT_FOLDER_ID: ${GOOGLE_DRIVE_ROOT_FOLDER_ID:-}
      DOCX_TEMPLATES_DIR: /app/templates
      KEYCLOAK_ENABLED: ${KEYCLOAK_ENABLED:-true}
      KEYCLOAK_URL: ${KEYCLOAK_URL:-https://auth.viti.edu.ua}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-grade-book}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      SCOPUS_API_ENABLED: ${SCOPUS_API_ENABLED:-false}
      SCOPUS_API_KEY: ${SCOPUS_API_KEY:-}
    ports:
      - "8081:8081"
    volumes:
      - ./templates:/app/templates
      - uploads:/app/uploads
      # Mount Google Drive credentials
      - ./gradebook-service.json:/app/config/google-credentials.json:ro

  # ─── Frontend (React + Nginx) ───
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tl-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/certs:/etc/nginx/certs:ro

volumes:
  pgdata:
  uploads:
